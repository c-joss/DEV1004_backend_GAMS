name: Build and Push Backend Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image
        run: docker build --target prod -t ${{ secrets.DOCKERHUB_USERNAME }}/gams-backend:1.0.0-prod .

      - name: Smoke test with secrets injected from GitHub Actions
        run: |
          docker run -d --name gams-backend-ci \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/gams-backend:1.0.0-prod
          sleep 10
          docker logs gams-backend-ci
          docker stop gams-backend-ci

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gams-backend:1.0.0-prod
